<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CTG Quick Self-Check — 差旅治理快速诊断</title>
<style>
  :root {
    --bg: #f8f9fb;
    --card-bg: #ffffff;
    --text: #1a1d28;
    --text-secondary: #5f6b7a;
    --text-muted: #8e99a9;
    --accent: #1e3a5f;
    --accent-light: #2c5282;
    --gold: #b7935b;
    --gold-light: #d4b87a;
    --border: #e2e6ed;
    --border-light: #eef0f4;
    --shadow-sm: 0 1px 3px rgba(0,0,0,.06);
    --shadow-md: 0 4px 16px rgba(0,0,0,.08);
    --shadow-lg: 0 8px 32px rgba(0,0,0,.10);
    --radius-sm: 8px;
    --radius: 12px;
    --radius-lg: 16px;
    --transition: 0.3s cubic-bezier(.4,0,.2,1);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --red: #c0392b;
    --red-bg: #fdf2f2;
    --amber: #b85c1a;
    --amber-bg: #fef9f0;
    --green: #1a6b4a;
    --green-bg: #f0faf5;
    --blue: #2563a0;
    --blue-bg: #f0f6fc;
    --neutral-bg: #f7f8fa;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px; -webkit-font-smoothing: antialiased; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    line-height: 1.6;
  }

  /* ── App Shell ── */
  .app {
    width: 100%;
    max-width: 640px;
    background: var(--card-bg);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    overflow: hidden;
    position: relative;
    min-height: 480px;
  }

  /* ── Progress Bar ── */
  .progress-wrap {
    height: 4px;
    background: var(--border-light);
    position: relative;
    opacity: 0;
    transition: opacity .25s;
  }
  .progress-wrap.visible { opacity: 1; }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--gold));
    transition: width .5s cubic-bezier(.4,0,.2,1);
    border-radius: 0 2px 2px 0;
  }

  /* ── Screen Container ── */
  .screen {
    padding: 40px 44px 44px;
    animation: fadeIn .35s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  /* ── Welcome Screen ── */
  .welcome { text-align: center; padding-top: 56px; padding-bottom: 56px; }
  .welcome-badge {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .06em;
    padding: 6px 16px;
    border-radius: 100px;
    margin-bottom: 24px;
  }
  .welcome h1 { font-size: 28px; font-weight: 700; color: var(--accent); margin-bottom: 10px; letter-spacing: -.01em; }
  .welcome .subtitle { font-size: 15px; color: var(--text-secondary); margin-bottom: 8px; }
  .welcome .meta {
    display: flex; gap: 20px; justify-content: center; margin: 28px 0 36px;
    font-size: 14px; color: var(--text-muted);
  }
  .welcome .meta span { display: flex; align-items: center; gap: 6px; }
  .welcome .meta .icon { font-size: 16px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 14px 36px; border-radius: 100px; font-size: 16px; font-weight: 600;
    cursor: pointer; border: none; transition: var(--transition);
    font-family: var(--font); text-decoration: none;
  }
  .btn-primary {
    background: var(--accent); color: #fff;
    box-shadow: 0 2px 8px rgba(30,58,95,.25);
  }
  .btn-primary:hover { background: var(--accent-light); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(30,58,95,.3); }
  .btn-outline {
    background: transparent; color: var(--accent);
    border: 1.5px solid var(--border);
  }
  .btn-outline:hover { border-color: var(--accent); background: rgba(30,58,95,.03); }
  .btn-sm { padding: 10px 24px; font-size: 14px; }
  .btn:disabled { opacity: .4; cursor: not-allowed; pointer-events: none; }

  /* ── Question Screen ── */
  .q-header { margin-bottom: 28px; }
  .q-group {
    font-size: 12px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .08em; color: var(--gold); margin-bottom: 8px;
  }
  .q-counter { font-size: 13px; color: var(--text-muted); float: right; }
  .q-title {
    font-size: 20px; font-weight: 650; color: var(--text);
    line-height: 1.5; letter-spacing: -.005em;
  }

  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 32px; }
  .option {
    display: flex; align-items: center; gap: 14px;
    padding: 16px 18px; border: 1.5px solid var(--border);
    border-radius: var(--radius); cursor: pointer;
    transition: var(--transition); background: var(--card-bg);
    font-size: 15px; color: var(--text);
  }
  .option:hover { border-color: #bcc4d0; background: #fafbfc; }
  .option.selected {
    border-color: var(--accent); background: #f5f7fb;
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  .option-radio {
    width: 20px; height: 20px; border-radius: 50%;
    border: 2px solid var(--border); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: var(--transition);
  }
  .option.selected .option-radio {
    border-color: var(--accent); background: var(--accent);
  }
  .option.selected .option-radio::after {
    content: ''; width: 6px; height: 6px; border-radius: 50%; background: #fff;
  }
  .option-label { flex: 1; }

  .q-nav { display: flex; justify-content: space-between; align-items: center; }

  /* ── Results Screen ── */
  .result { padding-top: 32px; padding-bottom: 40px; }
  .result-badge {
    display: inline-block; padding: 6px 14px; border-radius: 100px;
    font-size: 13px; font-weight: 600; letter-spacing: .04em; margin-bottom: 20px;
  }
  .result-badge.warn { background: var(--red-bg); color: var(--red); }
  .result-badge.info { background: var(--amber-bg); color: var(--amber); }
  .result-badge.ok { background: var(--green-bg); color: var(--green); }
  .result-badge.neutral { background: var(--blue-bg); color: var(--blue); }

  .result-headline {
    font-size: 26px; font-weight: 700; color: var(--accent);
    line-height: 1.4; margin-bottom: 16px; letter-spacing: -.01em;
  }
  .result-body {
    font-size: 15px; color: var(--text-secondary); line-height: 1.85;
    margin-bottom: 28px;
  }

  /* ── Quadrant Chart ── */
  .chart-wrap {
    background: var(--bg); border-radius: var(--radius);
    padding: 24px 20px 20px; margin-bottom: 28px;
    text-align: center;
  }
  .chart-wrap h3 { font-size: 14px; color: var(--text-muted); font-weight: 500; margin-bottom: 12px; }
  .chart-wrap svg { max-width: 100%; height: auto; display: block; margin: 0 auto; }
  .chart-dot { animation: pulse 2s ease infinite; }
  @keyframes pulse {
    0%, 100% { opacity: 1; r: 6; }
    50% { opacity: .7; r: 8; }
  }
  .chart-legend { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 14px; font-size: 12px; color: var(--text-muted); }
  .chart-legend span { display: flex; align-items: center; gap: 5px; }
  .chart-legend .dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

  /* ── Email Capture ── */
  .capture-wrap {
    background: var(--bg); border-radius: var(--radius);
    padding: 24px; margin-bottom: 24px;
  }
  .capture-wrap h3 { font-size: 16px; font-weight: 650; color: var(--text); margin-bottom: 6px; }
  .capture-wrap p { font-size: 13px; color: var(--text-muted); margin-bottom: 16px; }
  .capture-form { display: flex; gap: 10px; }
  .capture-form input {
    flex: 1; padding: 12px 16px; border: 1.5px solid var(--border);
    border-radius: 100px; font-size: 14px; font-family: var(--font);
    outline: none; transition: var(--transition);
  }
  .capture-form input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(30,58,95,.08); }
  .capture-form .btn { flex-shrink: 0; }
  .capture-success { color: var(--green); font-size: 14px; font-weight: 500; text-align: center; padding: 8px 0; display: none; }

  /* ── CTA Section ── */
  .cta-section {
    text-align: center; padding-top: 8px; border-top: 1px solid var(--border-light);
  }
  .cta-section p { font-size: 14px; color: var(--text-secondary); margin-bottom: 14px; }
  .cta-section .btn-primary { background: var(--gold); box-shadow: 0 2px 8px rgba(183,147,91,.25); }
  .cta-section .btn-primary:hover { background: var(--gold-light); }

  /* ── Shareable Quote ── */
  .share-quote {
    background: linear-gradient(135deg, #f5f7fb 0%, #eef1f6 100%);
    border-left: 4px solid var(--accent);
    padding: 18px 22px; border-radius: 0 var(--radius) var(--radius) 0;
    margin-bottom: 24px; font-size: 16px; font-weight: 600;
    color: var(--accent); position: relative;
  }
  .share-quote .copy-btn {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    background: var(--card-bg); border: 1px solid var(--border);
    padding: 6px 14px; border-radius: 100px; font-size: 12px;
    cursor: pointer; color: var(--text-secondary); transition: var(--transition);
    font-family: var(--font);
  }
  .share-quote .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
  .share-quote .copy-btn.copied { background: var(--green); color: #fff; border-color: var(--green); }

  /* ── Responsive ── */
  @media (max-width: 600px) {
    body { padding: 0; align-items: flex-start; }
    .app { border-radius: 0; min-height: 100vh; max-width: 100%; box-shadow: none; }
    .screen { padding: 28px 20px 32px; }
    .welcome { padding-top: 40px; padding-bottom: 40px; }
    .welcome h1 { font-size: 24px; }
    .q-title { font-size: 18px; }
    .result-headline { font-size: 22px; }
    .capture-form { flex-direction: column; }
    .share-quote .copy-btn { position: static; transform: none; margin-top: 10px; display: inline-block; }
    .share-quote { display: flex; flex-direction: column; align-items: flex-start; }
  }

  /* ── Restart Link ── */
  .restart-link {
    display: block; text-align: center; margin-top: 20px;
    font-size: 13px; color: var(--text-muted); cursor: pointer;
    text-decoration: underline; text-underline-offset: 3px;
  }
  .restart-link:hover { color: var(--text-secondary); }


  /* ── Bilingual ── */
  .en { display: block; font-weight: 500; }
  .zh { display: block; font-size: 0.85em; color: var(--text-secondary); margin-top: 2px; }
  .q-title .en { font-size: 1.05em; }
  .option-label .en { font-size: 0.95em; }
  .result-headline .en { font-size: 0.95em; }

  /* ── Booking Modal ── */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45);
    z-index: 1000; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--card-bg); border-radius: var(--radius-lg);
    padding: 32px 28px 28px; width: 100%; max-width: 440px;
    box-shadow: var(--shadow-lg); position: relative;
    animation: modalIn .3s ease;
  }
  @keyframes modalIn { from { opacity: 0; transform: translateY(16px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .modal-close {
    position: absolute; top: 14px; right: 18px; background: none; border: none;
    font-size: 22px; cursor: pointer; color: var(--text-muted); padding: 4px 8px;
    border-radius: 4px; line-height: 1;
  }
  .modal-close:hover { color: var(--text); background: var(--border-light); }
  .modal h3 { font-size: 20px; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
  .modal .modal-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }
  .modal .field { margin-bottom: 16px; }
  .modal .field label { display: block; font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 5px; }
  .modal .field input {
    width: 100%; padding: 12px 14px; border: 1.5px solid var(--border);
    border-radius: var(--radius-sm); font-size: 14px; font-family: var(--font);
    outline: none; transition: var(--transition);
  }
  .modal .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(30,58,95,.08); }
  .modal .btn-row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; }
  .modal .btn-row .btn { padding: 11px 28px; font-size: 14px; }
  .modal-success { display: none; text-align: center; padding: 20px 0; }
  .modal-success .icon { font-size: 40px; margin-bottom: 12px; }
  .modal-success p { font-size: 14px; color: var(--text-secondary); }
</style>
</head>
<body>

<div class="app">
  <div class="progress-wrap" id="progressWrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
  <div class="screen" id="screen"></div>
</div>

<!-- Booking Modal -->
<div class="modal-overlay" id="bookingModal">
  <div class="modal">
    <button class="modal-close" onclick="closeBooking()">×</button>
    <div id="bookingForm">
      <h3><span class="en">Book a Free 15-Minute Diagnostic Conversation</span><span class="zh">预约15分钟免费诊断对话</span></h3>
      <p class="modal-sub"><span class="en">Fill in your details below. We'll confirm a time within 24 hours.</span><span class="zh">填写以下信息，我们会在24小时内与您确认时间</span></p>
      <div class="field">
        <label>🏢 <span class="en">Company Name</span><span class="zh">公司名称</span> *</label>
        <input type="text" id="bkCompany" placeholder="Company name / 公司名称" autocomplete="organization">
      </div>
      <div class="field">
        <label>👤 <span class="en">Contact Name</span><span class="zh">联系人姓名</span> *</label>
        <input type="text" id="bkName" placeholder="Your name / 您的姓名" autocomplete="name">
      </div>
      <div class="field">
        <label>📧 <span class="en">Email</span><span class="zh">邮箱</span> *</label>
        <input type="email" id="bkEmail" placeholder="Your work email / 企业邮箱" autocomplete="email">
      </div>
      <div class="field">
        <label>🕐 <span class="en">Preferred Time</span><span class="zh">计划的时间</span></label>
        <input type="text" id="bkTime" placeholder="e.g. Any weekday afternoon next week / 如：下周任意工作日下午">
      </div>
      <div class="btn-row">
        <button class="btn btn-outline btn-sm" onclick="closeBooking()"><span class="en">Cancel</span><span class="zh">取消</span></button>
        <button class="btn btn-primary btn-sm" onclick="submitBooking()"><span class="en">Submit Booking</span><span class="zh">提交预约</span></button>
      </div>
    </div>
    <div class="modal-success" id="bookingSuccess">
      <div class="icon">✅</div>
      <h3><span class="en">Booking Submitted</span><span class="zh">预约已提交</span></h3>
      <p><span class="en">We'll confirm your diagnostic conversation time via email within 24 hours.</span><span class="zh">我们会在24小时内通过邮件与您确认诊断对话时间。</span></p>
      <button class="btn btn-outline btn-sm" style="margin-top:16px" onclick="closeBooking()"><span class="en">Close</span><span class="zh">关闭</span></button>
    </div>
  </div>
</div>

<script>
// ─────────────────────────────────────
//  CTG Quick Self-Check — Quiz Engine
// ─────────────────────────────────────

const QUESTIONS = [
  // ── Group A: Business Context (4 questions) ──
  {
    id: 'A1', group: 'Group A · Business Context', groupLabel: 'Business Context / 业务复杂度',
    title: '<span class="en">How many countries/regions does your company operate in?</span><span class="zh">贵公司业务覆盖的国家/地区数量？</span>',
    options: ['<span class="en">Mainland China only</span><span class="zh">仅中国大陆</span>', '<span class="en">2–5 countries/regions</span><span class="zh">2–5个国家/地区</span>', '<span class="en">6–15 countries/regions</span><span class="zh">6–15个国家/地区</span>', '<span class="en">15+ countries/regions</span><span class="zh">15个以上国家/地区</span>']
  },
  {
    id: 'A2', group: 'Group A · Business Context', groupLabel: 'Business Context / 业务复杂度',
    title: '<span class="en">What is your global headcount?</span><span class="zh">公司全球员工规模？</span>',
    options: ['<span class="en">Under 500</span><span class="zh">500人以下</span>', '<span class="en">500–2,000</span><span class="zh">500–2000人</span>', '<span class="en">2,000–10,000</span><span class="zh">2000–10000人</span>', '<span class="en">10,000+</span><span class="zh">10000人以上</span>']
  },
  {
    id: 'A3', group: 'Group A · Business Context', groupLabel: 'Business Context / 业务复杂度',
    title: '<span class="en">How has your company\'s travel volume changed over the past 12 months?</span><span class="zh">过去12个月，公司整体差旅规模的变化趋势？</span>',
    options: ['<span class="en">Flat or contracting</span><span class="zh">基本持平或收缩</span>', '<span class="en">Moderate growth (under 20%)</span><span class="zh">温和增长（低于20%）</span>', '<span class="en">Significant growth (20%–50%)</span><span class="zh">显著增长（20%–50%）</span>', '<span class="en">Rapid expansion (50%+ or new overseas markets)</span><span class="zh">快速扩张（50%以上，或新进入多个海外市场）</span>']
  },
  {
    id: 'A4', group: 'Group A · Business Context', groupLabel: 'Business Context / 业务复杂度',
    title: '<span class="en">What level of compliance, data protection, and travel safety does your business require?</span><span class="zh">贵公司业务对合规、数据保护、出行安全的要求程度？</span>',
    options: ['<span class="en">Low (primarily domestic travel)</span><span class="zh">较低（以国内出差为主）</span>', '<span class="en">Moderate (overseas operations, standard business travel)</span><span class="zh">中等（有海外业务，标准商务差旅为主）</span>', '<span class="en">High (multinational operations, industry regulation or data compliance)</span><span class="zh">较高（跨国运营，涉及行业监管或数据合规）</span>', '<span class="en">Very high (financial/pharma/energy regulated industries, or high-risk destinations)</span><span class="zh">很高（金融/医药/能源等强监管行业，或员工常赴高风险地区）</span>']
  },
  // ── Group B: Current Governance Capability (8 questions) ──
  {
    id: 'B1', group: 'Group B · Governance Capability', groupLabel: 'Governance Capability / 治理能力',
    title: '<span class="en">Who is responsible for travel management?</span><span class="zh">差旅由谁负责？</span>',
    options: ['<span class="en">No dedicated owner — employees or admin handle ad-hoc</span><span class="zh">没有人专门负责，员工或行政自行处理</span>', '<span class="en">Finance/Admin manages on the side, mainly cost-focused</span><span class="zh">财务/行政顺带管理，主要关注费用</span>', '<span class="en">Dedicated travel coordinator handling daily operations</span><span class="zh">有专职差旅负责人，主要处理日常运营</span>', '<span class="en">Dedicated Travel Manager focused on policy and cross-functional coordination</span><span class="zh">有专职Travel Manager，重点关注政策制定和跨部门协调</span>', '<span class="en">Travel Governance Committee with executive participation</span><span class="zh">有Travel Governance Committee，高管参与决策</span>']
  },
  {
    id: 'B2', group: 'Group B · Governance Capability', groupLabel: 'Governance Capability / 治理能力',
    title: '<span class="en">What travel data is visible to management?</span><span class="zh">管理层能看到什么样的差旅数据？</span>',
    options: ['<span class="en">Minimal attention paid</span><span class="zh">基本不关注</span>', '<span class="en">Finance sees total expense reports</span><span class="zh">财务能看到总费用报表</span>', '<span class="en">Department heads see their unit analytics</span><span class="zh">部门负责人能看到本部门分析</span>', '<span class="en">CXO/executives regularly review enterprise dashboards and trends</span><span class="zh">CXO/高管定期看到企业级Dashboard和趋势</span>']
  },
  {
    id: 'B3', group: 'Group B · Governance Capability', groupLabel: 'Governance Capability / 治理能力',
    title: '<span class="en">What is the current state of your travel data and systems?</span><span class="zh">差旅数据和系统现状？</span>',
    options: ['<span class="en">No system — paper/email-based</span><span class="zh">无系统，纸质/邮件流程为主</span>', '<span class="en">Admin-assisted booking with fragmented data</span><span class="zh">由行政/秘书比价代订，数据比较分散</span>', '<span class="en">TMC/online booking with department-level data visibility</span><span class="zh">有TMC/在线预订系统，能看到部门级数据</span>', '<span class="en">Integrated systems (HR/Finance/Travel) with analytics capability</span><span class="zh">系统已打通（HR/财务/差旅一体化），具备分析能力</span>', '<span class="en">Self-built travel platform with dashboards and predictive analytics</span><span class="zh">自建差旅平台及数据分析看板，具备预测能力</span>']
  },
  {

// ── Score Calculation ──
function normalize(value, maxOptionIndex) {
  // Normalize any option index (0-based) to a 1-4 scale.
  // maxOptionIndex: 3 for 4-option questions, 4 for 5-option questions.
  // We map 0→1, maxOptionIndex→4
  return 1 + (value / maxOptionIndex) * 3;
}

function calculateScores(answers) {
  // Group A: each A1-A4 has 4 options (indices 0-3)
  const A1 = normalize(answers.A1, 3);
  const A2 = normalize(answers.A2, 3);
  const A3 = normalize(answers.A3, 3);
  const A4 = normalize(answers.A4, 3);
  const contextLevel = (A1 + A2 + A3 + A4) / 4;

  // Cognition: Core four dimensions — B1 Ownership (30%), B2 Executive Visibility (25%), B7 Strategic Objective (25%), B8 Business Integration (20%)
  const B1_norm = normalize(answers.B1, 4);
  const B2_norm = normalize(answers.B2, 3);
  const B7_norm = normalize(answers.B7, 4);
  const B8_norm = normalize(answers.B8, 4);
  const cognitionLevel = B1_norm * 0.30 + B2_norm * 0.25 + B7_norm * 0.25 + B8_norm * 0.20;

  // Capability: B3 (5 options, 0-4) + B4 (4) + B5 (4) + B6 (4)
  const B3_norm = normalize(answers.B3, 4);
  const B4_norm = normalize(answers.B4, 3);
  const B5_norm = normalize(answers.B5, 3);
  const B6_norm = normalize(answers.B6, 3);
  const capabilityLevel = (B3_norm + B4_norm + B5_norm + B6_norm) / 4;

  // Current = Core-based with bounded Support adjustment (per CTG Scoring Methodology V2 §3.3)
  // Support clearly ahead does NOT raise the rating ("tool illusion" guardrail).
  let currentLevel;
  if (capabilityLevel < cognitionLevel - 0.5) {
    currentLevel = cognitionLevel - 0.3 * (cognitionLevel - capabilityLevel - 0.5);
  } else {
    currentLevel = cognitionLevel;
  }

  return { contextLevel, cognitionLevel, capabilityLevel, currentLevel };
}

function determineResult(scores) {
  const { contextLevel, cognitionLevel, capabilityLevel, currentLevel } = scores;
  const GAP = 1.0; // minimum gap of 1 level on the 1-4 scale to trigger directional results

  // Priority 1: Context notably higher than Current → Governance Behind
  if (contextLevel - currentLevel >= GAP) {
    return 'governance_behind';
  }

  // Priority 2: Capability notably higher than Cognition → Tool Ahead
  if (capabilityLevel - cognitionLevel >= GAP) {
    return 'tool_ahead';
  }

  // Priority 3: Cognition notably higher than Capability → Vision Ahead
  if (cognitionLevel - capabilityLevel >= GAP) {
    return 'vision_ahead';
  }

  // Priority 4: Current notably higher than Context → Governance Ahead
  if (currentLevel - contextLevel >= GAP) {
    return 'governance_ahead';
  }

	  // No strong gap on any dimension → use quadrant position so text never contradicts the chart dot
	  const ctxHigh = contextLevel >= 2.5;
	  const curHigh = currentLevel >= 2.5;
	  if (ctxHigh && curHigh)   return 'aligned_mature';
	  if (!ctxHigh && !curHigh) return 'aligned_foundational';
	  if (ctxHigh && !curHigh)  return 'governance_behind';
	  return 'governance_ahead';
}

// ── Quadrant Chart (SVG) ──
function renderQuadrantChart(scores, resultKey) {
  // Map scores (1-4 scale) to chart coordinates (0-100)
  const ctxPct = Math.round(((scores.contextLevel - 1) / 3) * 100);
  const curPct = Math.round(((scores.currentLevel - 1) / 3) * 100);

  // Larger chart + generous padding for bilingual labels
  const W = 440, H = 370;
  const pad = { top: 52, right: 48, bottom: 52, left: 64 };
  const pw = W - pad.left - pad.right;
  const ph = H - pad.top - pad.bottom;
  const cx = pad.left + (curPct / 100) * pw;
  const cy = pad.top + ((100 - ctxPct) / 100) * ph;

  const midX = pad.left + pw / 2;
  const midY = pad.top + ph / 2;

  const qColors = {
    'top-left':     { fill: '#fdf2f2', accent: '#e8c8c8' },
    'top-right':    { fill: '#f0faf5', accent: '#c0dfd0' },
    'bottom-left':  { fill: '#f7f8fa', accent: '#d8dce2' },
    'bottom-right': { fill: '#f0f6fc', accent: '#c8d8e8' }
  };

  function getHighlightQuadrant(ctxPct, curPct) {
    if (ctxPct >= 50 && curPct >= 50) return 'top-right';
    if (ctxPct >= 50 && curPct < 50) return 'top-left';
    if (ctxPct < 50 && curPct >= 50) return 'bottom-right';
    return 'bottom-left';
  }
  const highlightQuadrant = getHighlightQuadrant(ctxPct, curPct);

  const qPaths = {
    'top-left':     `M${midX},${pad.top} L${pad.left},${pad.top} L${pad.left},${midY} L${midX},${midY} Z`,
    'top-right':    `M${midX},${pad.top} L${pad.left+pw},${pad.top} L${pad.left+pw},${midY} L${midX},${midY} Z`,
    'bottom-left':  `M${midX},${pad.top+ph} L${pad.left},${pad.top+ph} L${pad.left},${midY} L${midX},${midY} Z`,
    'bottom-right': `M${midX},${pad.top+ph} L${pad.left+pw},${pad.top+ph} L${pad.left+pw},${midY} L${midX},${midY} Z`
  };

  // Two-line labels: EN on top, ZH below — rendered via <tspan>
  const quadrantLabels = [
    { en: 'Governance',     zh: 'Behind / 治理落后',   x: pad.left + 8,  y: pad.top + 16, align: 'start' },
    { en: 'Aligned',        zh: 'Mature / 治理同步',    x: pad.left + pw - 8, y: pad.top + 16, align: 'end' },
    { en: 'Aligned',        zh: 'Foundational / 基础匹配', x: pad.left + 8,  y: pad.top + ph - 14, align: 'start' },
    { en: 'Governance',     zh: 'Ahead / 治理领先',     x: pad.left + pw - 8, y: pad.top + ph - 14, align: 'end' }
  ];

  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:440px" xmlns="http://www.w3.org/2000/svg">`;

  // Quadrant backgrounds
  for (const [qName, coords] of Object.entries(qPaths)) {
    const isHighlight = qName === highlightQuadrant;
    svg += `<path d="${coords}" fill="${qColors[qName].fill}" stroke="${isHighlight ? qColors[qName].accent : '#e8ecf0'}" stroke-width="${isHighlight ? 1.5 : 0.5}"/>`;
  }

  // Grid lines
  svg += `<line x1="${pad.left}" y1="${midY}" x2="${pad.left+pw}" y2="${midY}" stroke="#d0d5dc" stroke-width="0.5" stroke-dasharray="4,4"/>`;
  svg += `<line x1="${midX}" y1="${pad.top}" x2="${midX}" y2="${pad.top+ph}" stroke="#d0d5dc" stroke-width="0.5" stroke-dasharray="4,4"/>`;

  // Axis lines
  svg += `<line x1="${pad.left}" y1="${pad.top+ph}" x2="${pad.left+pw}" y2="${pad.top+ph}" stroke="#8e99a9" stroke-width="1"/>`;
  svg += `<line x1="${pad.left}" y1="${pad.top}" x2="${pad.left}" y2="${pad.top+ph}" stroke="#8e99a9" stroke-width="1"/>`;

  // Axis arrows
  svg += `<polygon points="${pad.left+pw+4},${pad.top+ph} ${pad.left+pw-4},${pad.top+ph-4} ${pad.left+pw-4},${pad.top+ph+4}" fill="#8e99a9"/>`;
  svg += `<polygon points="${pad.left},${pad.top-4} ${pad.left-4},${pad.top+6} ${pad.left+4},${pad.top+6}" fill="#8e99a9"/>`;

  // Axis labels
  svg += `<text x="${pad.left+pw/2}" y="${pad.top+ph+34}" text-anchor="middle" fill="#5f6b7a" font-size="11">Current Governance →</text>`;
  svg += `<text x="${pad.left-48}" y="${pad.top+ph/2}" text-anchor="middle" fill="#5f6b7a" font-size="11" transform="rotate(-90,${pad.left-48},${pad.top+ph/2})">Business Context →</text>`;

  // Axis tick labels
  svg += `<text x="${pad.left}" y="${pad.top+ph+18}" text-anchor="middle" fill="#8e99a9" font-size="10">Low</text>`;
  svg += `<text x="${pad.left+pw}" y="${pad.top+ph+18}" text-anchor="middle" fill="#8e99a9" font-size="10">High</text>`;
  svg += `<text x="${pad.left-16}" y="${pad.top+6}" text-anchor="end" fill="#8e99a9" font-size="10">High</text>`;
  svg += `<text x="${pad.left-16}" y="${pad.top+ph+6}" text-anchor="end" fill="#8e99a9" font-size="10">Low</text>`;

  // Quadrant labels — two-line with EN bold + ZH smaller
  for (const lbl of quadrantLabels) {
    svg += `<text x="${lbl.x}" y="${lbl.y}" text-anchor="${lbl.align}" fill="#5f6b7a" font-size="11" font-weight="600">${lbl.en}</text>`;
    svg += `<text x="${lbl.x}" y="${lbl.y + 14}" text-anchor="${lbl.align}" fill="#8e99a9" font-size="10">${lbl.zh}</text>`;
  }

  // Dot glow + dot
  svg += `<defs><radialGradient id="dotGlow"><stop offset="0%" stop-color="${getDotColor(resultKey)}" stop-opacity="0.35"/><stop offset="100%" stop-color="${getDotColor(resultKey)}" stop-opacity="0"/></radialGradient></defs>`;
  svg += `<circle cx="${cx}" cy="${cy}" r="16" fill="url(#dotGlow)"/>`;
  svg += `<circle cx="${cx}" cy="${cy}" r="6" fill="${getDotColor(resultKey)}" stroke="#fff" stroke-width="2.5" class="chart-dot"/>`;

  // Dot label — bilingual
  const lx = cx > midX ? 18 : -18;
  const ly = cy > midY ? 18 : -14;
  svg += `<text x="${cx + lx}" y="${cy + ly}" text-anchor="${cx > midX ? 'start' : 'end'}" fill="${getDotColor(resultKey)}" font-size="11" font-weight="700">You are here</text>`;
  svg += `<text x="${cx + lx}" y="${cy + ly + 13}" text-anchor="${cx > midX ? 'start' : 'end'}" fill="${getDotColor(resultKey)}" font-size="9" opacity="0.7">您在这里</text>`;

  svg += `</svg>`;

  return `
    <div class="chart-wrap">
      <h3>Governance Positioning · 治理定位四象限视图</h3>
      ${svg}
      <div class="chart-legend">
        <span><span class="dot" style="background:#c0392b"></span> Governance Behind / 治理落后</span>
        <span><span class="dot" style="background:#1a6b4a"></span> Aligned Mature / 治理同步</span>
        <span><span class="dot" style="background:#8e99a9"></span> Aligned Foundational / 基础匹配</span>
        <span><span class="dot" style="background:#2563a0"></span> Governance Ahead / 治理领先</span>
      </div>
    </div>
  `;
}

function getDotColor(resultKey) {
  const map = {
    governance_behind: '#c0392b',
    tool_ahead: '#b85c1a',
    vision_ahead: '#b85c1a',
    aligned_foundational: '#5f6b7a',
    aligned_mature: '#1a6b4a',
    governance_ahead: '#2563a0'
  };
  return map[resultKey] || '#1e3a5f';
}

// ── Email Capture ──
function submitEmail() {
  const input = document.getElementById('emailInput');
  const email = input.value.trim();
  if (!email || !email.includes('@')) {
    input.style.borderColor = '#c0392b';
    input.focus();
    setTimeout(() => { input.style.borderColor = ''; }, 2000);
    return;
  }

  // Build detailed answer report
  const answersDetail = QUESTIONS.map((q, i) => ({
    group: q.groupLabel,
    question: q.title,
    answer: q.options[state.answers[q.id]] || '(unanswered)',
  }));

  const result = RESULTS[state.resultKey];
  const scores = calculateScores(state.answers);

  document.getElementById('captureForm').style.display = 'none';
  document.getElementById('captureSuccess').style.display = 'block';

  fetch('/api/submit-email', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      email: email,
      resultKey: state.resultKey,
      headline: result.headline,
      body: result.body,
      badge: result.badge,
      answersDetail: answersDetail,
      scores: {
        context: scores.contextLevel.toFixed(2),
        cognition: scores.cognitionLevel.toFixed(2),
        capability: scores.capabilityLevel.toFixed(2),
        current: scores.currentLevel.toFixed(2),
      },
    }),
  }).then(r => r.json())
    .then(data => console.log('CTG Lead submitted:', data))
    .catch(err => console.error('CTG Lead error:', err));
}

// ── Copy Quote ──
function copyQuote(btn) {
  const result = RESULTS[state.resultKey];
  navigator.clipboard.writeText(result.headline).then(() => {
    btn.textContent = '✓ 已复制';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = '📋 <span class="en">Copy</span><span class="zh">复制判断句</span>';
      btn.classList.remove('copied');
    }, 2000);
  }).catch(() => {
    btn.textContent = '复制失败';
    setTimeout(() => { btn.textContent = '📋 <span class="en">Copy</span><span class="zh">复制判断句</span>'; }, 1500);
  });
}

// ── Booking Modal ──
function openBooking() {
  document.getElementById('bookingModal').classList.add('open');
  document.getElementById('bookingForm').style.display = 'block';
  document.getElementById('bookingSuccess').style.display = 'none';
  // Pre-fill email if already captured
  const capturedEmail = document.getElementById('emailInput')?.value;
  if (capturedEmail && capturedEmail.includes('@')) {
    document.getElementById('bkEmail').value = capturedEmail;
  }
}

function closeBooking() {
  document.getElementById('bookingModal').classList.remove('open');
}

function submitBooking() {
  const company = document.getElementById('bkCompany').value.trim();
  const name = document.getElementById('bkName').value.trim();
  const email = document.getElementById('bkEmail').value.trim();
  const preferredTime = document.getElementById('bkTime').value.trim();

  if (!company) { document.getElementById('bkCompany').style.borderColor='#c0392b'; return; }
  if (!name) { document.getElementById('bkName').style.borderColor='#c0392b'; return; }
  if (!email || !email.includes('@')) { document.getElementById('bkEmail').style.borderColor='#c0392b'; return; }

  fetch('/api/submit-booking', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ company, name, email, preferredTime }),
  }).then(r => r.json())
    .then(data => {
      if (data.success) {
        document.getElementById('bookingForm').style.display = 'none';
        document.getElementById('bookingSuccess').style.display = 'block';
        console.log('Booking submitted:', { company, name, email, preferredTime });
      }
    })
    .catch(err => console.error('Booking error:', err));
}

// Close modal on backdrop click
document.getElementById('bookingModal').addEventListener('click', function(e) {
  if (e.target === this) closeBooking();
});

// ── Init ──
renderWelcome();
</script>
